<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GACHA</title>
<!-- コレクションサイト(多ガチャ版 2026-11-06)。URL: /g/<id>/  /g/<id>/u/<user>  /g/<id>/u/<user>/showcase  /u/<user>(全ガチャまとめ)  /help
     文言・レア度・ギフト表・排出率はすべて /api/gachas と /api/config(gacha.json)・/api/items(items.json) から。WT 固有の処理は無い。旧版は index.html.bak_20261106_multi -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070c;--card:#111118;--line:#262633;--cyan:#00ffff;--mag:#ff00ff;--gold:#ffd700;--txt:#f2f2f6;--mut:#9a9ab0;
    --c-C:#9fd8ff;--c-R:#00ffff;--c-SR:#ffd700;--c-UR:#ff4fd8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;line-height:1.5}
  a{color:var(--cyan)}
  header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,7,12,.92);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.08em}
  header h1 span{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
  header nav{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
  .gtabs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .gtabs a{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#0b0b12;color:#ddd;text-decoration:none;font-weight:700}
  .gtabs a.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px #0ff6}
  .btn{display:inline-block;padding:8px 14px;border-radius:10px;border:1px solid var(--cyan);background:#06181c;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
  .btn.mag{border-color:var(--mag);background:#1a061a}.btn.gold{border-color:var(--gold);background:#1a1606;color:#fff}
  .btn.sm{padding:4px 10px;font-size:13px}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  input[type=text]{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#0b0b12;color:#fff;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .mut{color:var(--mut);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .v{background:#0b0b12;border:2px solid var(--rc,#333);border-radius:12px;padding:6px;text-align:center;position:relative;cursor:pointer;transition:transform .12s}
  .v:hover{transform:translateY(-2px)}
  .v img{width:100%;aspect-ratio:2/1;object-fit:contain}
  /* 2026-11-09: 画像が無いとき(ローカルも公式も無い)。シルエットは中間の灰色、レア度の色は光だけ。「画像なし / No image」を必ず出す */
  .v .noimg{width:100%;aspect-ratio:2/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;background:repeating-linear-gradient(135deg,#ffffff08 0 8px,#0000 8px 16px)}
  .v .noimg .sil{height:56%;width:auto;max-width:86%;color:#b9bfcc;filter:drop-shadow(0 0 5px var(--rc))}
  .v .noimg .nil{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#c8ccd6;line-height:1}
  .v .noimg .nf{height:11px;width:auto;border-radius:2px}
  .v .n{font-size:13px;font-weight:700;line-height:1.2;min-height:2.4em}
  .v .s{font-size:11px;color:var(--mut)}
  .v.no{opacity:.28;filter:grayscale(1)}
  .v .r{position:absolute;top:4px;left:6px;font-size:11px;font-weight:900;color:var(--rc)}
  .v .c{position:absolute;top:4px;right:6px;font-size:11px;background:#000a;padding:0 6px;border-radius:8px}
  .v.rb{border-image:linear-gradient(135deg,#ff4fd8,#ffd700,#00ffff,#ff4fd8) 1;box-shadow:0 0 14px #ff4fd8aa}
  .v.fav::after{content:"★";position:absolute;bottom:4px;right:6px;color:var(--gold);font-size:18px;text-shadow:0 0 6px var(--gold)}
  .bar{height:12px;background:#1b1b26;border-radius:6px;overflow:hidden;margin:4px 0 8px}
  .bar i{display:block;height:100%;background:var(--rc);box-shadow:0 0 8px var(--rc)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .tabs button{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#0b0b12;color:#ddd;cursor:pointer}
  .tabs button.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px #0ff6}
  table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  .modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{max-width:560px;width:100%}
  .big{font-size:40px;font-weight:900;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
  .idbox{font-family:monospace;font-size:22px;background:#000;border:1px solid var(--gold);color:var(--gold);padding:8px 12px;border-radius:8px;word-break:break-all}
  #stageWrap{display:flex;gap:16px;flex-wrap:wrap}
  #stageWrap canvas{max-width:100%;width:360px;border:1px solid var(--line);border-radius:12px;background:#000}
  h2{font-size:18px;margin:0 0 10px;color:var(--cyan)}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--rc);color:#000;font-weight:900;font-size:12px}
  .pill.rb{background:linear-gradient(90deg,#ff4fd8,#ffd700,#00ffff)}
  details summary{cursor:pointer;font-weight:700}
  img.flag{height:.9em;width:auto;vertical-align:-0.08em;border-radius:2px;box-shadow:0 0 0 1px #0006;margin-right:.2em}
  .gcard{display:block;background:#0b0b12;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
  .gcard:hover{border-color:var(--cyan)}
  .gcard h3{margin:0 0 6px;font-size:18px;color:var(--cyan)}
  @media(max-width:600px){header h1{font-size:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
</style>
</head>

<script>
/* ===================== i18n ===================== */
const I = {
  ja:{home:'ホーム',help:'自分のIDの調べ方',search_ph:'@ユーザー名 または 数字のユーザーID',search:'コレクションを見る',
    recent:'最近の排出',leader:'コレクターランキング',unique:'ユニーク所持',pulls:'総排出',notfound:'まだ記録がありません。配信でギフトを送るとここに登録されます。',
    first_title:'はじめての方へ',first_body:'このサイトは、配信でギフトを送って引いたガチャのコレクションを見るサイトです。<br>自分のページは <b>@ユーザー名</b> か <b>数字のユーザーID</b> で開けます。@名は変更できるので、長く使うなら数字IDをブックマークしてください。',
    first_ok:'わかった',first_help:'数字IDの調べ方を見る',your_id:'あなたの数字ID（固定・変わりません）',bookmark:'このURLをブックマーク',
    all:'すべて',owned_only:'所持のみ',showcase:'ショーケース（画像を作る）',fav_hint:'★をタップしてお気に入りに追加（最大9個・この端末に保存）',
    make:'画像を生成',download:'PNGを保存',share:'共有',story:'ストーリー 9:16',square:'正方形 1:1',cap_ph:'ひとこと（任意）',
    pity_sr:'確定まであと',tree:'ツリー',premium:'プレミアム',squadron:'隊列',event:'イベント/ギフト',
    rates:'排出率',gifts:'ギフトと連数',ground:'陸',air:'空',heli:'ヘリ',naval:'海',last:'最終',first:'初回',dup:'×',
    all_gachas:'全ガチャのコレクション',open:'開く',kinds:'種',no_items:'アイテムがまだ登録されていません',
    help_html:`<h2>自分の数字のユーザーIDの調べ方</h2>
<p><b>いちばん簡単：</b>このサイトの検索欄に <b>@ユーザー名</b> を入れて開くと、ページ上部に数字IDが表示されます（ギフトを1回でも送ったことがある場合）。そのURL <code>/u/数字ID</code> をブックマークすれば、@名を変えても同じページが開けます。</p>

<p>数字IDはアカウント作成時に決まり、@ユーザー名を変更しても変わりません。</p>`},
  en:{home:'Home',help:'Find your ID',search_ph:'@username or numeric user ID',search:'Open collection',
    recent:'Recent pulls',leader:'Top collectors',unique:'Unique owned',pulls:'Total pulls',notfound:'No record yet. Send a gift on stream and you will appear here.',
    first_title:'Welcome',first_body:'This site shows your gacha collection, pulled by sending gifts on stream.<br>Open your page with your <b>@username</b> or your <b>numeric user ID</b>. Usernames can change, so bookmark the numeric-ID URL.',
    first_ok:'Got it',first_help:'How to find my numeric ID',your_id:'Your numeric ID (permanent)',bookmark:'Bookmark this URL',
    all:'All',owned_only:'Owned only',showcase:'Showcase (make an image)',fav_hint:'Tap ★ to favorite (max 9, saved on this device)',
    make:'Generate',download:'Save PNG',share:'Share',story:'Story 9:16',square:'Square 1:1',cap_ph:'Caption (optional)',
    pity_sr:'guaranteed in',tree:'Tech tree',premium:'Premium',squadron:'Squadron',event:'Event/Gift',
    rates:'Drop rates',gifts:'Gifts & rolls',ground:'Ground',air:'Air',heli:'Heli',naval:'Naval',last:'last',first:'first',dup:'×',
    all_gachas:'Collections in all gachas',open:'Open',kinds:'items',no_items:'No items registered yet',
    help_html:`<h2>How to find your numeric TikTok user ID</h2>
<p><b>Easiest:</b> type your <b>@username</b> in the search box here. If you have ever sent a gift, your numeric ID is shown at the top of your page. Bookmark <code>/u/&lt;numeric ID&gt;</code> — it keeps working even if you rename your @username.</p>
<p><b>On your own:</b> the TikTok app settings do not show the numeric ID (unverified). On a desktop browser, open your profile page and search the page source for <code>"id":"…digits…"</code>, or use a third-party "TikTok ID lookup" service.</p>
<p>The numeric ID is assigned when the account is created and never changes.</p>`}
};
let LANG = localStorage.getItem('wtg_lang') || (navigator.language.startsWith('ja')?'ja':'en');
const t = k => (I[LANG]||I.ja)[k] ?? k;
const GROUP_N = {usa:['アメリカ','USA'],germany:['ドイツ','Germany'],ussr:['ソ連','USSR'],britain:['イギリス','Britain'],japan:['日本','Japan'],china:['中国','China'],italy:['イタリア','Italy'],france:['フランス','France'],sweden:['スウェーデン','Sweden'],israel:['イスラエル','Israel']};
const gn = c => (GROUP_N[c]||[c,c])[LANG==='ja'?0:1];
const catN = c => ({ground:t('ground'),air:t('air'),heli:t('heli'),naval:t('naval')}[c]||c);
const vname = v => (LANG==='ja' || !v.name_en) ? (v.name || v.name_ja || v.id) : v.name_en;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flagOf = v => { try{ return flagImg(typeof v==='string'?{country:v}:{country:v.group||'', operator:(v.meta||{}).operator||''}); }catch(e){ return ''; } };

/* ===================== data(ガチャ別) ===================== */
let GACHAS = [], GID = '', CFG = {}, RAR = [], RB = {}, LEG = [], ITEMS = null, VBY = {};
const RC = r => (RB[r]?.color==='rainbow') ? '#ff4fd8' : (RB[r]?.color || getComputedStyle(document.documentElement).getPropertyValue('--c-'+r).trim() || '#fff');
const isRB = r => RB[r]?.color==='rainbow';
const rlab = r => RB[r] ? (LANG==='ja' ? (RB[r].label||r) : (RB[r].label_en||RB[r].label||r)) : r;
const STATIC = !!(window.STATIC_SITE || location.protocol==='file:'); // 2026-11-08 静的モード: GitHub Pages などデーモンの無い所では site_export の JSON を読む
const IMG = id => window.DEMO ? (VBY[id]?.img || '') : STATIC ? `img/${encodeURIComponent(GID)}/${encodeURIComponent(id)}.webp` : `/img/${encodeURIComponent(GID)}/${encodeURIComponent(id)}.png`;
const IMG_ALT = id => VBY[id]?.img || '';   // 2026-11-09: 2 番目 = 公式(static.encyclopedia.warthunder.com)。1 番目はサイトと同じ場所の WebP(site_export.py が書き出す)
const NOIMG_TXT = '画像なし / No image';
// 画像の順番: 1 ローカル WebP → 2 公式 URL → 3 カテゴリのシルエット＋国旗＋「画像なし / No image」(flags.js の SIL/silKind/flagImg を使う)。空のカードは出さない
window.siteImgErr = img => { const d = img.dataset || {};
  if (d.alt && !d.tried){ d.tried = '1'; img.src = d.alt; return; }
  const box = document.createElement('div'); box.className = 'noimg';
  const sil = (window.SIL && d.k && SIL[d.k]) || '';
  let fl = ''; try{ fl = window.flagImg ? flagImg({country:d.c||'', operator:d.o||''}, 'nf') : ''; }catch(e){}
  box.innerHTML = sil + `<div class="nil">${fl}<span>${NOIMG_TXT}</span></div>`;
  img.replaceWith(box); };
const gq = (sep='?') => sep + 'gacha=' + encodeURIComponent(GID);
if (window.DEMO){ // デモ: /api/* を同梱データで応答(静的公開の下準備)
  const _f = window.fetch.bind(window);
  window.fetch = (u,o)=>{ const url=String(u); const j=x=>Promise.resolve(new Response(JSON.stringify(x),{headers:{'Content-Type':'application/json'}}));
    if (url.startsWith('/api/gachas')) return j({ok:true, active:DEMO.config.gacha, gachas:[DEMO.config]});
    if (url.startsWith('/api/items') || url.startsWith('/api/vehicles')) return j({items:DEMO.items||DEMO.vehicles});
    if (url.startsWith('/api/config')) return j(DEMO.config);
    if (url.startsWith('/api/recent')) return j({ok:true,recent:DEMO.recent});
    if (url.startsWith('/api/leaderboard')) return j({ok:true,leaderboard:DEMO.leaderboard});
    if (url.startsWith('/api/user')) { const q=decodeURIComponent((url.match(/[?&]q=([^&]*)/)||[])[1]||'').toLowerCase(); const hit=DEMO.users.find(x=>x.user.user_id===q||('@'+(x.user.handle||'').toLowerCase())===q||(x.user.handle||'').toLowerCase()===q); return hit?j(Object.assign({ok:true},hit)):j({ok:false}); }
    return _f(u,o); };
}
if (STATIC && !window.DEMO){ // 静的モード: /api/* を site_export/ の JSON で応答(書き出しは gacha_daemon → site_export.py、5 分ごと)
  const _f = window.fetch.bind(window), _c = {};
  const J = path => (_c[path] ||= _f(path, {cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null));
  const j = x => Promise.resolve(new Response(JSON.stringify(x),{headers:{'Content-Type':'application/json'}}));
  const qp = (url,k) => { const m=url.match(new RegExp('[?&]'+k+'=([^&]*)')); try{ return m?decodeURIComponent(m[1]):''; }catch(e){ return m?m[1]:''; } };
  async function idxRows(h){ const ix = await J('users_index.json'); if (!ix) return [];
    if (!ix.shards) return ix.users||[];
    const ch = /^[a-z0-9]/.test(h) ? h[0] : '_'; const f = ix.shards[ch]; if (!f) return []; const sh = await J(f); return (sh&&sh.users)||[]; }
  async function findUser(q){ // q: 数字 ID / @名 / 名前。見つからなければ前方一致の候補
    q = (q||'').trim(); const h = q.replace(/^@/,'').toLowerCase();
    if (/^[0-9]{1,30}$/.test(q)){ const d = await J('users/'+q+'.json'); if (d) return {d}; }
    const rows = await idxRows(h);
    const hit = rows.find(r=>r[0]===h) || rows.find(r=>r[1]===q) || rows.find(r=>r[2]===q);
    if (hit){ const d = await J('users/'+encodeURIComponent(hit[1])+'.json'); if (d) return {d}; }
    return {cand: h ? rows.filter(r=>r[0].startsWith(h)).slice(0,10).map(r=>({user_id:r[2], handle:r[3], last_seen:r[4]})) : []}; }
  window.fetch = async (u,o)=>{ const url=String(u);
    if (!url.startsWith('/api/')) return _f(u,o);
    const gid = qp(url,'gacha'); const G = await J('gachas.json') || {gachas:[],configs:{}};
    const gg = gid && gid!=='all' ? gid : G.active;
    if (url.startsWith('/api/gachas')) return j({ok:true, active:G.active, gachas:G.gachas});
    if (url.startsWith('/api/config')) { const c=(G.configs||{})[gg]; return c ? j(c) : j({ok:false}); }
    if (url.startsWith('/api/items') || url.startsWith('/api/vehicles')) return j(await J('items/'+encodeURIComponent(gg)+'.json') || {items:[]});
    if (url.startsWith('/api/recent')) { const R = await J('recent.json'); let rec = ((R||{}).gachas||{})[gg] || [];
      const mn = qp(url,'min'); const rar = (((G.configs||{})[gg]||{}).rarities||[]).map(r=>r.key);
      if (mn && rar.includes(mn)) rec = rec.filter(r=>rar.indexOf(r.rarity)>=rar.indexOf(mn));
      return j({ok:true, gacha:gg, recent:rec}); }
    if (url.startsWith('/api/leaderboard')) { const L = await J('leaderboard.json'); const b = ((L||{}).gachas||{})[gg] || {leaderboard:[]}; return j(Object.assign({ok:true, gacha:gg}, b)); }
    if (url.startsWith('/api/user')) { const q = qp(url,'q'); const f = await findUser(q);
      if (!f.d) return j({ok:false, error:'not_found', q, candidates:f.cand||[]});
      const d = f.d, us = Object.assign({display_name:''}, d.user);
      if (gid==='all'){ const out = Object.entries(d.gachas||{}).map(([k,v])=>{ const c=(G.configs||{})[k]||{}; return {gacha:k, name:c.name||k, user:us, stats:v.stats, rarities:c.rarities||[]}; });
        return out.length ? j({ok:true, q, gachas:out}) : j({ok:false, error:'not_found', q}); }
      const v = (d.gachas||{})[gg]; if (!v) return j({ok:false, error:'not_found', q, candidates:[]});
      return j({ok:true, gacha:gg, user:Object.assign({}, us, {since_sr:v.since_sr, since_ssr:v.since_ssr}), owned:v.owned, recent:v.recent, stats:v.stats}); }
    if (url.startsWith('/api/resolve')) { const f = await findUser(qp(url,'q')); return j({ok:true, candidates: f.d ? [f.d.user] : (f.cand||[])}); }
    return j({ok:false, error:'static'}); };
}
async function loadGachas(){ if (GACHAS.length) return; const d = await (await fetch('/api/gachas')).json(); GACHAS = d.gachas||[]; GACHAS._active = d.active; }
async function useGacha(id){
  await loadGachas();
  const want = id || GACHAS._active || (GACHAS[0]||{}).id || '';
  if (want === GID && CFG.gacha) return true;
  if (!GACHAS.some(g=>g.id===want)) return false;
  const cfg = await (await fetch('/api/config?gacha='+encodeURIComponent(want))).json();
  if (!cfg || cfg.ok===false || !cfg.rarities) return false;
  GID = want; ITEMS = null; VBY = {}; CFG = cfg;
  RAR = (CFG.rarities||[]).map(r=>r.key); RB = Object.fromEntries((CFG.rarities||[]).map(r=>[r.key,r])); LEG = CFG.legendary||[];
  for (const r of CFG.rarities||[]) document.documentElement.style.setProperty('--c-'+r.key, RC(r.key));
  document.title = CFG.name || 'GACHA';
  document.getElementById('h1').innerHTML = `<span>${esc(LANG==='ja'?CFG.name:(CFG.name_en||CFG.name))}</span>`;
  renderGTabs();
  return true;
}
function renderGTabs(){
  const el = document.getElementById('gtabs');
  el.innerHTML = GACHAS.length>1 ? GACHAS.map(g=>`<a href="/g/${encodeURIComponent(g.id)}/" data-nav class="${g.id===GID?'on':''}">${esc(LANG==='ja'?g.name:(g.name_en||g.name))}</a>`).join('') : '';
}
async function loadItems(){ if (ITEMS) return; const d = await (await fetch('/api/items'+gq())).json(); const all = d.items||d.vehicles||d;
  const pc = CFG.pool||{}, cats=new Set(pc.categories||[]), grs=new Set(pc.groups||pc.countries||[]), ex=new Set(pc.exclude_ids||[]), mr=pc.min_rank||0;

async function route(){

  if (p === '/help') { await useGacha(''); return app.innerHTML = `<div class="box">${t('help_html')}</div>`; }
  let m = p.match(/^\/g\/([^/]+)\/?(?:u\/([^/]+)(\/showcase)?)?$/);
  if (m){ if (!(await useGacha(m[1]))) return app.innerHTML = `<div class="box">unknown gacha: ${esc(m[1])}</div>`;

    const flags = await Promise.all(fav.map(id=>{ const v=VBY[id]||{}; return flagImages({country:v.group||'', operator:(v.meta||{}).operator||''}); }));
    const load1 = src => new Promise(res=>{ if(!src) return res(null); const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
    const imgs = await Promise.all(fav.map(async id=> (await load1(IMG(id))) || (await load1(IMG_ALT(id)))));   // 2026-11-09: ローカル WebP(同じオリジン)→ 公式。どちらも無ければ下でシルエット
    fav.forEach((id,i)=>{ const v=VBY[id]; if(!v) return; const m=v.meta||{}; const x=40+(i%cols)*(cw+20), y=gy+Math.floor(i/cols)*(ch+20), col=RC(v.rarity);
      g.fillStyle='rgba(0,0,0,.6)'; g.strokeStyle=col; g.lineWidth=5; g.shadowColor=col; g.shadowBlur=22; roundRect(g,x,y,cw,ch,22); g.fill(); g.stroke(); g.shadowBlur=0;
      const im=imgs[i]; { const ih=ch*0.56, iw=Math.min(cw-24, ih*2);
        if(im) g.drawImage(im, x+(cw-iw)/2, y+14, iw, ih);
        else { drawSil(g, window.silKind?silKind(v):'', x+(cw-iw)/2+iw*0.12, y+14+ih*0.06, iw*0.76, ih*0.7, '#b9bfcc', col);
               g.font=F('700 '+(story?18:13)+'px'); g.textAlign='center'; g.fillStyle='#c8ccd6'; g.fillText(NOIMG_TXT, x+cw/2, y+14+ih*0.92); } }
      g.font=F('900 '+(story?18:14)+'px'); g.textAlign='left'; g.fillStyle=col; g.fillText(v.rarity, x+12, y+(story?26:20));
      g.textAlign='center'; g.fillStyle='#fff'; g.font=F('900 '+(story?24:17)+'px');
      { const fh=story?20:14, fw=fh*1.5, ty=y+ch-(story?36:26), fl=flags[i]||[], fwAll=fl.length*(fw+4); const label=vname(v); let txt=label; while(g.measureText(txt).width>cw-30-fwAll && txt.length>3) txt=txt.slice(0,-2)+'…';
        const tw=g.measureText(txt).width, sx=x+cw/2-(tw+fwAll+4)/2; fl.forEach((fi,j)=>g.drawImage(fi, sx+j*(fw+4), ty-fh+3, fw, fh));
        g.textAlign='left'; g.fillText(txt, sx+fwAll+4, ty); g.textAlign='center'; }
      g.font=F('700 '+(story?16:12)+'px'); g.fillStyle='#9a9ab0'; g.fillText([gn(v.group), m.rank?'R'+m.rank:'', m.br?'BR '+m.br:'', owned[id].n>1?'×'+owned[id].n:''].filter(Boolean).join(' · '), x+cw/2, y+ch-(story?12:9)); });
    const cap = document.getElementById('cap').value.trim();
    if (cap){ g.font=F('700 '+(story?34:24)+'px'); g.textAlign='center'; g.fillStyle='#fff'; fitText(g, cap, W/2, H-(story?110:70), W-120); }
    if (CFG.credit){ g.font=F('700 '+(story?22:16)+'px'); g.fillStyle='#777'; g.textAlign='center'; g.fillText(CFG.credit, W/2, H-(story?40:24)); }
  }
  // 2026-11-09: flags.js の SIL(SVG)を Path2D でキャンバスに描く(画像として読まないのでキャンバスが汚れない)。path/rect/circle/ellipse/g に対応
  function drawSil(g, kind, x, y, w, h, col, glow){ const s=(window.SIL||{})[kind]; if(!s) return false;
    const svg=new DOMParser().parseFromString(s.replace(/currentColor/g,'CUR'),'image/svg+xml').documentElement;
    const vb=(svg.getAttribute('viewBox')||'0 0 200 100').split(/[\s,]+/).map(Number), sc=Math.min(w/vb[2], h/vb[3]);
    g.save(); g.translate(x+(w-vb[2]*sc)/2, y+(h-vb[3]*sc)/2); g.scale(sc,sc); g.shadowColor=glow||col; g.shadowBlur=12;
    const C=f=>(!f||f==='CUR')?col:f;
    const walk=(el,inh)=>{ for(const c of el.children){ const A=k=>parseFloat(c.getAttribute(k)||'0');
      const st={fill:c.getAttribute('fill')??inh.fill, op:inh.op*parseFloat(c.getAttribute('fill-opacity')??'1'), stroke:c.getAttribute('stroke')??inh.stroke, sw:parseFloat(c.getAttribute('stroke-width')??inh.sw), cap:c.getAttribute('stroke-linecap')??inh.cap};
      const tag=c.tagName.toLowerCase(); if(tag==='g'){ walk(c,st); continue; }
      let p=new Path2D();
      if(tag==='path') p=new Path2D(c.getAttribute('d')||'');
      else if(tag==='rect'){ const r=A('rx'); if(r&&p.roundRect) p.roundRect(A('x'),A('y'),A('width'),A('height'),r); else p.rect(A('x'),A('y'),A('width'),A('height')); }
      else if(tag==='circle') p.arc(A('cx'),A('cy'),A('r'),0,Math.PI*2);
      else if(tag==='ellipse') p.ellipse(A('cx'),A('cy'),A('rx'),A('ry'),0,0,Math.PI*2);
      else continue;
      if(st.fill!=='none'){ g.globalAlpha=st.op; g.fillStyle=C(st.fill); g.fill(p); }
      if(st.stroke&&st.stroke!=='none'){ g.globalAlpha=st.op; g.strokeStyle=C(st.stroke); g.lineWidth=st.sw||1; g.lineCap=st.cap||'butt'; g.stroke(p); }
      g.globalAlpha=1; } };
    walk(svg,{fill:svg.getAttribute('fill')||'CUR', op:1, stroke:null, sw:1, cap:'butt'});
    g.restore(); return true; }
  function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  function fitText(g,txt,x,y,maxw){ let s=txt; while(g.measureText(s).width>maxw && s.length>3) s=s.slice(0,-2)+'…'; g.fillText(s,x,y); }
  document.getElementById('mk').onclick = draw; document.getElementById('fmt').onchange = draw; document.getElementById('cap').onchange = draw;
  const fname = ()=>`${GID}gacha_${(u.handle||u.user_id||'me').replace(/[^\w]/g,'')}.png`;
  document.getElementById('dl').onclick = ()=>{ const a=document.createElement('a'); a.download=fname(); a.href=cv.toDataURL('image/png'); a.click(); };
  document.getElementById('sh').onclick = async()=>{ cv.toBlob(async b=>{ const f=new File([b],fname(),{type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[f]})) { try{ await navigator.share({files:[f], text:title}); }catch(e){} }
    else document.getElementById('dl').click(); }); };
  await draw();
}
route();
</script>
